apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qwui.fullname" . }}
  labels:
    {{- include "qwui.labels" . | nindent 4 }}
    {{- with .Values.deploymentLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "qwui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "qwui.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "qwui.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: QUICKWIT_URL
              value: {{ .Values.quickwit.url | quote }}
            - name: PORT
              value: "8080"
            {{- with .Values.maxExportDocs }}
            - name: MAX_EXPORT_DOCS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oidc.internalUrl }}
            - name: OIDC_INTERNAL_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.oidc.caSecret.name }}
            - name: OIDC_CA_FILE
              value: /etc/qwui/oidc-ca/{{ .Values.oidc.caSecret.key }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          # 503 until the OIDC provider has been discovered.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- if or .Values.oidc.caSecret.name .Values.extraVolumeMounts }}
          volumeMounts:
            {{- if .Values.oidc.caSecret.name }}
            - name: oidc-ca
              mountPath: /etc/qwui/oidc-ca
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if or .Values.oidc.caSecret.name .Values.extraVolumes }}
      volumes:
        {{- if .Values.oidc.caSecret.name }}
        - name: oidc-ca
          secret:
            secretName: {{ .Values.oidc.caSecret.name }}
            items:
              - key: {{ .Values.oidc.caSecret.key }}
                path: {{ .Values.oidc.caSecret.key }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
