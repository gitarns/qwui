replicaCount: 1

image:
  # The Rust backend is the only one.
  repository: ghcr.io/gitarns/qwui
  pullPolicy: IfNotPresent
  # Defaults to chart appVersion
  tag: ""

imagePullSecrets: []
# - name: my-registry-secret

nameOverride: ""
fullnameOverride: ""

deploymentAnnotations: {}
deploymentLabels: {}

podAnnotations: {}
podLabels: {}

service:
  type: ClusterIP
  port: 8080
  labels: {}
  annotations: {}

ingress:
  enabled: false
  className: ""
  labels: {}
  annotations: {}
  hosts:
    - host: qwui.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 500Mi

quickwit:
  url: "http://quickwit:7280"

# Maximum number of documents allowed per CSV export.
# Leave unset to use the backend default (10000).
maxExportDocs: ""

nodeSelector: {}

# Extra environment variables
extraEnv: []
# - name: FOO
#   value: bar
# - name: BAR
#   valueFrom:
#     secretKeyRef:
#       name: my-secret
#       key: bar

# Load all keys from a ConfigMap or Secret as environment variables
extraEnvFrom: []
# - secretRef:
#     name: my-secret
# - configMapRef:
#     name: my-configmap

# OIDC provider reached by qwui through another URL than the browser, with a
# private CA (e.g. Argo CD's Dex through its in-cluster Service). The rest of
# the OIDC settings go through extraEnv / extraEnvFrom.
oidc:
  # OIDC_INTERNAL_URL: replaces OIDC_ISSUER in qwui's own calls (discovery,
  # token, keys). Empty: qwui calls OIDC_ISSUER.
  internalUrl: ""
  # Secret holding a PEM CA bundle, mounted and passed as OIDC_CA_FILE.
  caSecret:
    name: ""
    key: ca.crt

# Extra volumes and mounts for the qwui container.
extraVolumes: []
extraVolumeMounts: []
