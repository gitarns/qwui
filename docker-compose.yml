services:
  quickwit:
    # Pinned to the Quickwit version qwui is deployed against. `edge` is
    # silently a different Quickwit, which makes local checks of the API surface
    # worthless: they would record edge's endpoints, not the ones a real cluster
    # serves. Bump this together with the real upgrade.
    image: quickwit/quickwit:v0.9.0
    pull_policy: missing
    ports:
      - "7280:7280"
    volumes:
      - quickwit_data:/quickwit/qwdata
    command: run
    healthcheck:
      # The Quickwit image ships neither curl nor wget, so the probe speaks
      # HTTP over bash's /dev/tcp. With curl, the check could never pass and
      # every service waiting on a healthy Quickwit refused to start.
      test: ["CMD", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/7280 && printf "GET /health/livez HTTP/1.0\r\n\r\n" >&3 && head -n1 <&3 | grep -q " 200 "']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  qwui:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      - QUICKWIT_URL=http://quickwit:7280
      - PORT=8080
    depends_on:
      quickwit:
        condition: service_healthy
    profiles:
      - backend

  data-generator:
    image: python:3.12-alpine
    depends_on:
      quickwit:
        condition: service_healthy
    volumes:
      - ./dev:/scripts
    command: python /scripts/generate.py
    restart: unless-stopped

  trace-generator:
    image: python:3.12-alpine
    depends_on:
      quickwit:
        condition: service_healthy
    volumes:
      - ./dev:/scripts
    environment:
      - QUICKWIT_URL=http://quickwit:7280
      - TRACE_RATE=3
    command: python /scripts/generate-traces.py
    restart: unless-stopped

volumes:
  quickwit_data:
